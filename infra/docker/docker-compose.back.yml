services:
  gateway:
    image: ghcr.io/borishru-boop/testvps-trade-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BACK_BIND_IP:-0.0.0.0}:${GATEWAY_PORT:-8080}:8080"
      - "${BACK_BIND_IP:-0.0.0.0}:${GATEWAY_TLS_PORT:-8443}:8443"
    volumes:
      - ${INTERNAL_GATEWAY_TLS_DIR:-/opt/internal-gateway-tls}:/certs:ro
    environment:
      APP_ENV: ${APP_ENV:-production}
      GATEWAY_PORT: "8080"
      GATEWAY_TLS_PORT: ${GATEWAY_TLS_PORT:-8443}
      GATEWAY_TLS_CERT: ${GATEWAY_TLS_CERT:-/certs/server.crt}
      GATEWAY_TLS_KEY: ${GATEWAY_TLS_KEY:-/certs/server.key}
      BACK_BIND_IP: ${BACK_BIND_IP:-0.0.0.0}
      BACK_GATEWAY_PUBLIC_OK: ${BACK_GATEWAY_PUBLIC_OK:-false}
      AUTH_SERVICE_URL: http://auth:8001
      BILLING_SERVICE_URL: http://billing:8002
      VPS_SERVICE_URL: http://vps:8003
      NOTIFICATION_SERVICE_URL: http://notification:8004
      SUPPORT_SERVICE_URL: http://support:8005
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_URL: ${REDIS_URL}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-300}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-120}
      RATE_LIMIT_SENSITIVE: ${RATE_LIMIT_SENSITIVE:-15}
      RATE_LIMIT_SENSITIVE_WINDOW: ${RATE_LIMIT_SENSITIVE_WINDOW:-1m}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-192.168.0.3,213.148.3.172}
      POSTGRES_DSN: ${POSTGRES_DSN}
      GATEWAY_PUBLIC_PORT: ${GATEWAY_PUBLIC_PORT:-443}
    depends_on:
      - auth
      - billing
      - vps
      - notification
      - support

  auth:
    image: ghcr.io/borishru-boop/testvps-trade-auth:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: "8001"
      POSTGRES_DSN: ${POSTGRES_DSN}
      POSTGRES_SSL_ALLOW_INSECURE: ${POSTGRES_SSL_ALLOW_INSECURE:-false}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      REDIS_URL: ${REDIS_URL}
      NOTIFICATION_SERVICE_URL: http://notification:8004
      EMAIL_CODE_TTL: ${EMAIL_CODE_TTL:-15m}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-15m}
      TELEGRAM_INTERNAL_TOKEN: ${TELEGRAM_INTERNAL_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN}
      REGISTRATION_PROMO_LIMIT: ${REGISTRATION_PROMO_LIMIT:-200}
      REGISTRATION_PROMO_BONUS_RUB: ${REGISTRATION_PROMO_BONUS_RUB:-500}
      REGISTRATION_PROMO_STARTED_AT: ${REGISTRATION_PROMO_STARTED_AT:-2026-08-02}
      BLOCKED_EMAIL_DOMAINS: ${BLOCKED_EMAIL_DOMAINS:-proton.me,protonmail.com,protonmail.ch,pm.me}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-192.168.0.3,213.148.3.172}

  billing:
    image: ghcr.io/borishru-boop/testvps-trade-billing:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: "8002"
      POSTGRES_DSN: ${POSTGRES_DSN}
      POSTGRES_SSL_ALLOW_INSECURE: ${POSTGRES_SSL_ALLOW_INSECURE:-false}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      BILLING_MOCK: ${BILLING_MOCK:-false}
      TBANK_ENABLED: ${TBANK_ENABLED:-false}
      TBANK_TERMINAL_KEY: ${TBANK_TERMINAL_KEY:-}
      TBANK_PASSWORD: ${TBANK_PASSWORD:-}
      TBANK_API_URL: ${TBANK_API_URL:-https://securepay.tinkoff.ru/v2}
      TBANK_NOTIFICATION_URL: ${TBANK_NOTIFICATION_URL:-}
      TBANK_SUCCESS_URL: ${TBANK_SUCCESS_URL:-}
      TBANK_FAIL_URL: ${TBANK_FAIL_URL:-}
      TBANK_TAXATION: ${TBANK_TAXATION:-usn_income}
      TBANK_RECEIPT_TAX: ${TBANK_RECEIPT_TAX:-none}
      TBANK_RECEIPT_ITEM_NAME: ${TBANK_RECEIPT_ITEM_NAME:-Пополнение баланса VPS}
      HELEKET_ENABLED: ${HELEKET_ENABLED:-false}
      HELEKET_MERCHANT_ID: ${HELEKET_MERCHANT_ID:-}
      HELEKET_API_KEY: ${HELEKET_API_KEY:-}
      HELEKET_API_URL: ${HELEKET_API_URL:-https://api.heleket.com/v1}
      HELEKET_CALLBACK_URL: ${HELEKET_CALLBACK_URL:-}
      HELEKET_SUCCESS_URL: ${HELEKET_SUCCESS_URL:-}
      HELEKET_RETURN_URL: ${HELEKET_RETURN_URL:-}
      HELEKET_CURRENCY: ${HELEKET_CURRENCY:-RUB}
      ROBOKASSA_ENABLED: ${ROBOKASSA_ENABLED:-false}
      ROBOKASSA_MERCHANT_LOGIN: ${ROBOKASSA_MERCHANT_LOGIN:-}
      ROBOKASSA_PASSWORD1: ${ROBOKASSA_PASSWORD1:-}
      ROBOKASSA_PASSWORD2: ${ROBOKASSA_PASSWORD2:-}
      ROBOKASSA_TEST_MODE: ${ROBOKASSA_TEST_MODE:-false}
      ROBOKASSA_SUCCESS_URL: ${ROBOKASSA_SUCCESS_URL:-}
      ROBOKASSA_FAIL_URL: ${ROBOKASSA_FAIL_URL:-}
      BILLING_CHARGE_INTERVAL: ${BILLING_CHARGE_INTERVAL:-15m}
      NOTIFICATION_SERVICE_URL: http://notification:8004
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN}

  billing-worker:
    image: ghcr.io/borishru-boop/testvps-trade-billing:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["/worker"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      POSTGRES_DSN: ${POSTGRES_DSN}
      POSTGRES_SSL_ALLOW_INSECURE: ${POSTGRES_SSL_ALLOW_INSECURE:-false}
      REDIS_URL: ${REDIS_URL}
