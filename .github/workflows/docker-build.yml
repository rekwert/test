name: Docker Build

# Manual only — auto builds on push burned the Actions minute quota.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/borishru-boop/testvps-trade

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: gateway
            context: .
            dockerfile: apps/gateway/Dockerfile
          - name: auth
            context: .
            dockerfile: services/auth/Dockerfile
          # Context must be repo root: Dockerfiles COPY packages/shared-go.
          - name: billing
            context: .
            dockerfile: services/billing/Dockerfile
          - name: vps
            context: .
            dockerfile: services/vps/Dockerfile
          - name: notification
            context: .
            dockerfile: services/notification/Dockerfile
          - name: support
            context: .
            dockerfile: services/support/Dockerfile
          - name: telegram-bot
            context: .
            dockerfile: services/telegram-bot/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
