name: CI

# Manual only — auto CI on push burned the Actions minute quota.
on:
  workflow_dispatch:

jobs:
  go-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - apps/gateway
          - services/auth
          - services/billing
          - services/vps
          - services/notification
          - services/support
          - services/telegram-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        working-directory: ${{ matrix.service }}
        run: |
          go mod tidy
          go build ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build
        working-directory: apps/web
        run: |
          npm install
          npm run build
